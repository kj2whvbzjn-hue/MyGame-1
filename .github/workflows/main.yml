name: Unity FAST Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - migration/battle-runtime
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  fast:
    name: FAST - Unity Compile and Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore Unity PackageCache
        id: unity-package-cache
        uses: actions/cache@v4
        with:
          path: Library/PackageCache
          key: unity-packagecache-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-packagecache-${{ runner.os }}-

      - name: Restore FAST incremental cache
        id: unity-fast-incremental-cache
        uses: actions/cache@v4
        with:
          path: |
            Library/Bee
            Library/ScriptAssemblies
            Library/ArtifactDB
            Library/DataStore
          key: unity-fast-incremental-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            unity-fast-incremental-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-

      - name: FAST diagnostics before Unity
        shell: bash
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "SHA: $GITHUB_SHA"
          df -h . || true

      - name: Run Unity FAST validation
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: AutomationEntry.ValidateOnly

      - name: Extract Unity errors
        if: always()
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/unity-error-report.txt"
          : > "$OUT"
          echo "Unity FAST error report" >> "$OUT"
          echo "Branch: $GITHUB_REF_NAME" >> "$OUT"
          echo "Run: $GITHUB_RUN_NUMBER  SHA: $GITHUB_SHA" >> "$OUT"
          echo >> "$OUT"

          FOUND=0
          for f in \
            "$GITHUB_WORKSPACE/Editor.log" \
            "$GITHUB_WORKSPACE/build/Editor.log" \
            "$GITHUB_WORKSPACE/build/UnityBuilder.log" \
            "$GITHUB_WORKSPACE/Library/Editor.log" \
            "$HOME/.config/unity3d/Editor.log" \
            "$HOME/.config/unity3d/Unity/Editor.log"; do
            if [ -f "$f" ]; then
              echo "===== $f =====" >> "$OUT"
              grep -Eain -C 5 'error CS[0-9]+|Scripts have compiler errors|Compilation failed|Script Compilation Error|Tundra build failed|Aborting batchmode due to failure|Unhandled Exception|Exception:|Build failed' "$f" >> "$OUT" || tail -300 "$f" >> "$OUT"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No standard Unity log found; searching workspace and Unity config directories." >> "$OUT"
            while IFS= read -r f; do
              echo "===== $f =====" >> "$OUT"
              grep -Eain -C 5 'error CS[0-9]+|Scripts have compiler errors|Compilation failed|Script Compilation Error|Tundra build failed|Aborting batchmode due to failure|Unhandled Exception|Exception:|Build failed' "$f" >> "$OUT" || tail -300 "$f" >> "$OUT"
              FOUND=1
            done < <(find "$GITHUB_WORKSPACE" "$HOME/.config/unity3d" -type f \( -iname 'Editor.log' -o -iname '*unity*.log' -o -iname '*builder*.log' \) 2>/dev/null | head -30)
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "No readable Unity log found." >> "$OUT"
          fi

          cat "$OUT"
          {
            echo '## Unity FAST error report'
            echo '```text'
            tail -500 "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Unity error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-fast-error-report-${{ github.run_number }}
          path: unity-error-report.txt
          if-no-files-found: warn
          retention-days: 14
