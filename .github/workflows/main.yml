name: Unity FAST Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - migration/battle-runtime
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  fast:
    name: FAST - Unity Compile and Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Restore Unity PackageCache
        id: unity-package-cache
        uses: actions/cache@v4
        with:
          path: Library/PackageCache
          key: unity-packagecache-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-packagecache-${{ runner.os }}-

      - name: Restore FAST incremental cache
        id: unity-fast-incremental-cache
        uses: actions/cache@v4
        with:
          path: |
            Library/Bee
            Library/ScriptAssemblies
            Library/ArtifactDB
            Library/DataStore
          key: unity-fast-incremental-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            unity-fast-incremental-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-

      - name: FAST diagnostics before Unity
        shell: bash
        run: |
          echo '=== FAST PERFORMANCE DIAGNOSTICS: BEFORE UNITY ==='
          echo "Branch: $GITHUB_REF_NAME"
          echo "SHA: $GITHUB_SHA"
          echo "PackageCache cache-hit: ${{ steps.unity-package-cache.outputs.cache-hit }}"
          echo "FAST incremental cache-hit: ${{ steps.unity-fast-incremental-cache.outputs.cache-hit }}"
          df -h . || true

      - name: Run Unity FAST validation
        id: unity_fast
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: AutomationEntry.ValidateOnly

      - name: Collect Unity logs and errors
        if: always()
        shell: bash
        run: |
          set +e
          REPORT="$GITHUB_WORKSPACE/unity-error-report.txt"
          FILES="$GITHUB_WORKSPACE/unity-log-files.txt"
          : > "$REPORT"
          : > "$FILES"

          echo "Unity FAST error report" >> "$REPORT"
          echo "Branch: $GITHUB_REF_NAME" >> "$REPORT"
          echo "Run: $GITHUB_RUN_NUMBER  SHA: $GITHUB_SHA" >> "$REPORT"
          echo "unity-builder outcome: ${{ steps.unity_fast.outcome }}" >> "$REPORT"
          echo >> "$REPORT"

          # game-ci may write logs under several workspace/temp/home locations.
          for root in "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME"; do
            [ -d "$root" ] || continue
            find "$root" -maxdepth 6 -type f \
              \( -iname 'Editor.log' -o -iname '*.log' -o -iname '*.txt' \) \
              -print 2>/dev/null >> "$FILES" || true
          done
          sort -u "$FILES" -o "$FILES"

          echo '===== discovered candidate log files =====' >> "$REPORT"
          grep -Ei 'unity|editor|game-ci|builder|build|bee|tundra' "$FILES" | tail -200 >> "$REPORT" || true
          echo >> "$REPORT"
          echo '===== extracted Unity/compiler errors =====' >> "$REPORT"

          MATCHED=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if grep -Eqi 'error CS[0-9]+|Scripts have compiler errors|Compilation failed|Script Compilation Error|Tundra build failed|Aborting batchmode due to failure|Unhandled Exception|Exception:|Build failed' "$f" 2>/dev/null; then
              echo >> "$REPORT"
              echo "----- $f -----" >> "$REPORT"
              grep -Eain -C 4 'error CS[0-9]+|Scripts have compiler errors|Compilation failed|Script Compilation Error|Tundra build failed|Aborting batchmode due to failure|Unhandled Exception|Exception:|Build failed' "$f" 2>/dev/null | tail -400 >> "$REPORT" || true
              MATCHED=1
            fi
          done < "$FILES"

          if [ "$MATCHED" -eq 0 ]; then
            echo 'No compiler/error pattern found in readable files.' >> "$REPORT"
            echo 'Candidate files were listed above for diagnosis.' >> "$REPORT"
          fi

          cat "$REPORT"
          {
            echo '## Unity FAST error report'
            echo
            echo '```text'
            tail -500 "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Unity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-fast-error-report-${{ github.run_number }}
          path: |
            unity-error-report.txt
            unity-log-files.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Fail workflow when Unity validation failed
        if: steps.unity_fast.outcome != 'success'
        shell: bash
        run: |
          echo 'Unity FAST validation failed. See the Job Summary or unity-fast-error-report artifact.'
          exit 1
