name: Unity FAST Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

permissions:
  contents: read

jobs:
  fast:
    name: FAST - Unity Compile and Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # Cache only downloaded Unity packages.
      # Whole-Library restore caused FAST exit code 137 on this project.
      - name: Restore Unity PackageCache
        id: unity-package-cache
        uses: actions/cache@v4
        with:
          path: Library/PackageCache
          key: unity-packagecache-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-packagecache-${{ runner.os }}-

      - name: Run Unity FAST validation
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: AutomationEntry.ValidateOnly
