name: Unity TEST - Local WebGL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: TEST - WebGL Build and Local Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true


      # Cache only WebGL compilation outputs that are expensive to regenerate.
      # Do NOT cache the whole Library directory: that previously caused exit code 137.
      - name: Restore WebGL Bee and Burst cache
        id: unity-webgl-build-cache
        uses: actions/cache@v4
        with:
          path: |
            Library/Bee/artifacts/WebGL
            Library/BurstCache/Wasm-Wasm
          key: unity-webgl-build-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            unity-webgl-build-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: AutomationEntry.BuildWebGL

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local WebGL server
        run: |
          python3 -m http.server 8080 --directory build/WebGL/WebGL > /tmp/webgl-server.log 2>&1 &
          echo $! > /tmp/webgl-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/webgl-server.log
          exit 1

      - name: Playwright local WebGL smoke test
        env:
          WEBGL_URL: http://127.0.0.1:8080/
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/check-webgl.mjs

      - name: Upload Playwright screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-playwright-webgl-screenshot
          path: playwright-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish latest TEST evidence for AI review
        if: always()
        run: |
          mkdir -p test-results/latest
          rm -f test-results/latest/webgl-smoke.png
          rm -f test-results/latest/webgl-smoke-failure.png
          rm -f test-results/latest/webgl-report.json

          if [ -f playwright-artifacts/webgl-smoke.png ]; then
            cp playwright-artifacts/webgl-smoke.png test-results/latest/webgl-smoke.png
          fi

          if [ -f playwright-artifacts/webgl-smoke-failure.png ]; then
            cp playwright-artifacts/webgl-smoke-failure.png test-results/latest/webgl-smoke-failure.png
          fi

          if [ -f playwright-artifacts/webgl-report.json ]; then
            cp playwright-artifacts/webgl-report.json test-results/latest/webgl-report.json
          fi

          cat > test-results/latest/run-info.json <<EOF
          {
            "workflow": "Unity TEST - Local WebGL",
            "run_id": "${GITHUB_RUN_ID}",
            "source_sha": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "result_files": "See this directory"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/latest

          if git diff --cached --quiet; then
            echo "No TEST evidence changes to commit."
            exit 0
          fi

          git commit -m "chore: publish latest TEST evidence [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
